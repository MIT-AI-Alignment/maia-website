<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			// Respect an explicit choice, otherwise follow the device before the first paint.
			let savedTheme;
			try {
				savedTheme = localStorage.getItem('theme');
			} catch { /* The system preference still works when storage is unavailable. */ }
			const initialTheme = savedTheme === 'light' || savedTheme === 'dark'
				? savedTheme
				: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			document.documentElement.classList.toggle('dark', initialTheme === 'dark');
			document.documentElement.style.colorScheme = initialTheme;
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta property="og:site_name" content="MIT AI Alignment (MAIA)" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://mitaialignment.org/images/brand/maia-social-preview.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="MAIA — MIT AI Alignment logo" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://mitaialignment.org/images/brand/maia-social-preview.png" />
		<meta name="twitter:image:alt" content="MAIA — MIT AI Alignment logo" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"@id": "https://mitaialignment.org/#organization",
				"name": "MIT AI Alignment",
				"alternateName": "MAIA",
				"url": "https://mitaialignment.org/",
				"logo": "https://mitaialignment.org/images/brand/maia-horizontal-size-5-light-transparent.svg",
				"description": "MIT's student community for AI safety, with fellowships, student research, talks, and workshops.",
				"email": "maia-exec@mit.edu"
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="dark:bg-black bg-gray-100">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
