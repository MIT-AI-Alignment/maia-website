<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<script>
			// Apply a saved light theme before paint; dark remains the default.
			try {
				document.documentElement.classList.toggle('dark', localStorage.getItem('theme') !== 'light');
			} catch { /* Use the default when browser storage is unavailable. */ }
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta property="og:site_name" content="MIT AI Alignment (MAIA)" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://aialignment.mit.edu/images/brand/maia-social-preview.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="MAIA — MIT AI Alignment logo" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://aialignment.mit.edu/images/brand/maia-social-preview.png" />
		<meta name="twitter:image:alt" content="MAIA — MIT AI Alignment logo" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="dark:bg-black bg-gray-100">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
